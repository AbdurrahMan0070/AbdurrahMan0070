<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#1a1446"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <g filter="url(#blur)">
    <circle cx="180" cy="60" r="80" fill="#7c3aed">
      <animate attributeName="cy" values="60;100;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="80" r="90" fill="#06b6d4">
      <animate attributeName="cy" values="80;40;80" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="20" r="60" fill="#ec4899">
      <animate attributeName="cx" values="600;680;600" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="300" y="35" width="600" height="110" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>

  <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#title)">
    Thanks for visiting
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c7d2fe">Let's build something great together</text>

  <path d="M0 170 q150 -50 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 L1800 220 L0 220 Z" fill="#7c3aed" fill-opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 180 q150 -40 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 L1800 220 L0 220 Z" fill="#06b6d4" fill-opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M0 192 q150 -30 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 L1800 220 L0 220 Z" fill="#ec4899" fill-opacity="0.3">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="15s" repeatCount="indefinite"/>
  </path>
</svg>
