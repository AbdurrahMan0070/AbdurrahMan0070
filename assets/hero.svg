<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#1a1446"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="c0"><rect x="160" y="245" height="40" width="0">
      <animate attributeName="width" dur="20s" repeatCount="indefinite" keyTimes="0;0;0.08;0.16;0.2;1" values="0;0;205;205;0;0"/>
    </rect></clipPath>
    <clipPath id="c1"><rect x="160" y="245" height="40" width="0">
      <animate attributeName="width" dur="20s" repeatCount="indefinite" keyTimes="0;0.2;0.28;0.36;0.4;1" values="0;0;158;158;0;0"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="160" y="245" height="40" width="0">
      <animate attributeName="width" dur="20s" repeatCount="indefinite" keyTimes="0;0.4;0.48;0.56;0.6;1" values="0;0;283;283;0;0"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="160" y="245" height="40" width="0">
      <animate attributeName="width" dur="20s" repeatCount="indefinite" keyTimes="0;0.6;0.68;0.76;0.8;1" values="0;0;376;376;0;0"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="160" y="245" height="40" width="0">
      <animate attributeName="width" dur="20s" repeatCount="indefinite" keyTimes="0;0.8;0.88;0.96;1;1" values="0;0;345;345;0;0"/>
    </rect></clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <g filter="url(#blur)">
    <circle cx="200" cy="90" r="110" fill="#7c3aed">
      <animate attributeName="cy" values="90;140;90" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="330" r="130" fill="#06b6d4">
      <animate attributeName="cy" values="330;280;330" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="40" r="80" fill="#ec4899">
      <animate attributeName="cx" values="640;720;640" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="100" y="70" width="1000" height="280" rx="32" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>

  <text x="160" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#c7d2fe">Hi, I'm</text>
  <text x="160" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#title)">Abdurrahman Shaikh</text>

  <g font-family="Courier New, Consolas, monospace" font-size="26" fill="#e0e7ff">
    <text x="160" y="275" textLength="203" lengthAdjust="spacingAndGlyphs" clip-path="url(#c0)">Web Developer</text>
    <text x="160" y="275" textLength="156" lengthAdjust="spacingAndGlyphs" clip-path="url(#c1)">AI Learner</text>
    <text x="160" y="275" textLength="281" lengthAdjust="spacingAndGlyphs" clip-path="url(#c2)">Software Developer</text>
    <text x="160" y="275" textLength="374" lengthAdjust="spacingAndGlyphs" clip-path="url(#c3)">Computer Science Student</text>
    <text x="160" y="275" textLength="343" lengthAdjust="spacingAndGlyphs" clip-path="url(#c4)">Full-Stack Developer</text>
  </g>

  <g fill="#e0e7ff">
    <g>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/>
      <rect x="160" y="252" width="3" height="30">
        <animate attributeName="x" dur="20s" repeatCount="indefinite" keyTimes="0;0;0.08;0.16;0.2;1" values="160;160;366;366;160;160"/>
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0001;0.2;1" values="0;1;0;0"/>
      </rect>
      <rect x="160" y="252" width="3" height="30">
        <animate attributeName="x" dur="20s" repeatCount="indefinite" keyTimes="0;0.2;0.28;0.36;0.4;1" values="160;160;319;319;160;160"/>
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2001;0.4;1" values="0;1;0;0"/>
      </rect>
      <rect x="160" y="252" width="3" height="30">
        <animate attributeName="x" dur="20s" repeatCount="indefinite" keyTimes="0;0.4;0.48;0.56;0.6;1" values="160;160;444;444;160;160"/>
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4001;0.6;1" values="0;1;0;0"/>
      </rect>
      <rect x="160" y="252" width="3" height="30">
        <animate attributeName="x" dur="20s" repeatCount="indefinite" keyTimes="0;0.6;0.68;0.76;0.8;1" values="160;160;537;537;160;160"/>
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6001;0.8;1" values="0;1;0;0"/>
      </rect>
      <rect x="160" y="252" width="3" height="30">
        <animate attributeName="x" dur="20s" repeatCount="indefinite" keyTimes="0;0.8;0.88;0.96;1;1" values="160;160;506;506;160;160"/>
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8001;1;1" values="0;1;0;0"/>
      </rect>
    </g>
  </g>

  <rect x="160" y="298" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
  <text x="215" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff">Python</text>
  <rect x="285" y="298" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
  <text x="340" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff">React</text>
  <rect x="410" y="298" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
  <text x="465" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ffffff">AI / ML</text>
</svg>
